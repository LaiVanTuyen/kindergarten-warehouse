# ===========================================================
# Nginx cho Portal & Admin demo
# ===========================================================
# Một file dùng chung cho CẢ HAI container: chúng chỉ khác nhau ở thư mục
# static được mount vào /usr/share/nginx/html.
#
# Tất cả đi qua CÙNG MỘT origin:
#   /                       → Angular static (SPA fallback về index.html)
#   /api/                   → backend demo trong docker network
#   /warehouse-demo-bucket/ → MinIO demo trong docker network
#
# Nhờ same-origin: không cần CORS, không cần SameSite=None, và không phải
# public backend hay MinIO ra Internet.
# ===========================================================

# Cloudflare Tunnel kết thúc TLS rồi gọi nginx bằng HTTP.
# Giữ đúng scheme gốc; nếu header vắng thì coi như https.
map $http_x_forwarded_proto $demo_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Khớp spring.servlet.multipart.max-request-size = 50MB.
    # Thiếu dòng này thì upload file lớn chết ở nginx với 413 trước khi tới app.
    client_max_body_size 50m;

    # DNS nội bộ của Docker. Cần resolver + biến trong proxy_pass để nginx
    # tra lại IP khi container backend/minio được tạo lại, thay vì cache IP cũ
    # lúc khởi động rồi 502 mãi.
    resolver 127.0.0.11 valid=30s ipv6=off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # --- API demo -------------------------------------------------------
    # "^~" bắt buộc: nếu không, location regex file tĩnh bên dưới sẽ cướp
    # mất những request kiểu /api/.../abc.png.
    location ^~ /api/ {
        set $demo_api http://app:8080;
        proxy_pass $demo_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $demo_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # Upload/tải tài liệu lớn: không đệm ra đĩa, nới timeout.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Asset công khai trên MinIO -------------------------------------
    # Backend chỉ set public-read cho asset hiển thị (avatar, banner, icon,
    # thumbnail). resources/files/* vẫn PRIVATE và chỉ tải được qua /api
    # với kiểm tra quyền, nên mở location này không làm lộ tài liệu.
    location ^~ /warehouse-demo-bucket/ {
        set $demo_minio http://minio:9000;
        proxy_pass $demo_minio$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $demo_forwarded_proto;
        proxy_intercept_errors off;
    }

    # --- Angular static -------------------------------------------------
    # index.html tuyệt đối không cache, nếu không người xem sẽ kẹt ở bản
    # build cũ và tải các file hash đã bị xoá.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Robots-Tag  "noindex, nofollow" always;
    }

    # File đã có hash trong tên (outputHashing: all) ⇒ cache dài hạn an toàn.
    location ~* \.(?:js|css|woff2|woff|ttf|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Robots-Tag  "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
